name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Browser core
        working-directory: apps/desktop
        run: npm run wasm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ebts ${{ github.ref_name }}"
          releaseBody: "Desktop builds for macOS (Apple Silicon and Intel), Windows and Linux. The macOS app is not notarized yet: after the first launch is blocked, open System Settings → Privacy & Security and choose Open Anyway, or run `xattr -dr com.apple.quarantine /Applications/ebts.app`."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
